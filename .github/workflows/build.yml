name: Test and build Windows download
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install and test backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - name: Build portable application
        shell: powershell
        run: ./build-release.ps1
      - name: Test renderer updates
        working-directory: ui
        run: node --test tests/*.test.js
      - name: Verify packaged resources
        shell: powershell
        run: |
          $appCheck = Start-Process -FilePath 'dist/S Garage/S Garage.exe' -ArgumentList '--check' -Wait -PassThru
          if ($appCheck.ExitCode -ne 0) { throw 'Packaged resource check failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: S-Garage-Windows-x64
          path: release/*
